# save as .pre-commit-config.yaml in repo root
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks: [{id: gitleaks}]
  - repo: local
    hooks:
      - id: no-pii-in-governance
        name: block PII patterns in governance/ and vault/
        entry: bash -c 'git diff --cached --name-only | grep -E "^(governance|vault)/" | xargs -r grep -nEi "[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}|\b[A-Z]{6}[0-9]{2}[A-Z][0-9]{2}[A-Z][0-9]{3}[A-Z]\b|IT[0-9]{2}[A-Z][0-9]{10}[A-Z0-9]{12}" && exit 1 || exit 0'
        language: system
        pass_filenames: false
